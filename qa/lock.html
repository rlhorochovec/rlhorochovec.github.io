<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login</title>

   <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   <!-- Bootstrap 5.3 (CSS & Icons) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

   <!-- Open Graph -->
   <meta property="og:title" content="Rafael Horochovec — QA Engineer SR">
   <meta property="og:description" content="HTML simples para execução de testes de interface.">
   <meta property="og:type" content="website">

   <link href="assets/css/login.css" rel="stylesheet">
   <link href="assets/css/custom.css" rel="stylesheet">

   <style>
      :root {
        --bg-deep: #0a0e17;
        --bg-surface: #121824;
        --bg-surface-hover: #1a2233;
        --neon-cyan: #00f2fe;
        --neon-blue: #4facfe;
        --neon-green: #00ff88;
        --neon-purple: #b160fd;
        --border-color: rgba(255, 255, 255, 0.08);
        --border-neon: rgba(0, 242, 254, 0.3);
      }

      body {
        background-color: var(--bg-deep);
        color: #cbd5e1;
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }

      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Container do Formulário centralizado estilo card Neon */
      .form-signin {
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        margin: auto;
      }

      .form-signin:hover {
        border-color: var(--border-neon);
        box-shadow: 0 10px 35px rgba(0, 242, 254, 0.1);
      }

      .img-circle {
        border-radius: 50%;
        border: 3px solid var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        object-fit: cover;
      }

      h1 {
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: .5px;
        text-align: center;
      }

      /* Ajuste dos inputs flutuantes para Dark Mode (mantendo alinhamento interno à esquerda para leitura de texto) */
      .form-floating {
        margin-bottom: 1rem;
        text-align: left;
      }

      .form-control {
        background-color: rgba(10, 14, 23, 0.6);
        border: 1px solid var(--border-color);
        color: #f8fafc;
        font-family: 'Space Grotesk', sans-serif;
      }

      .form-control:focus {
        background-color: rgba(10, 14, 23, 0.9);
        border-color: var(--neon-cyan);
        color: #f8fafc;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      }

      .form-control:disabled {
        background-color: rgba(255, 255, 255, 0.03);
        color: #94a3b8;
      }

      .form-floating label {
        color: #94a3b8;
      }

      .form-floating > .form-control:focus ~ label,
      .form-floating > .form-control:not(:placeholder-shown) ~ label {
        color: var(--neon-cyan);
      }

      /* Botão Neon */
      .btn-secondary {
        background: linear-gradient(135deg, #0072ff, var(--neon-cyan));
        border: none;
        color: #000;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        transition: all 0.3s ease;
      }

      .btn-secondary:hover {
        background: linear-gradient(135deg, var(--neon-cyan), #0072ff);
        box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        color: #000;
        transform: translateY(-1px);
      }

      /* Badge de Senha */
      .badge-skill {
        font-weight: 500;
        padding: .5rem 1rem;
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        background: rgba(255, 255, 255, 0.05) !important;
        color: var(--neon-cyan) !important;
        border: 1px solid var(--border-color);
        display: inline-block;
      }

      hr {
        border-color: var(--border-color);
      }

      .text-muted {
        color: #94a3b8 !important;
        font-size: 0.85rem;
        text-align: center;
      }
   </style>
</head>

<body>
   <main class="form-signin">
      <form>
         <img class="mb-4 img-circle" src="assets/img/xovec.jpeg" alt="" width="120" height="120">
         <h1 class="h3 mb-3 fw-normal">Informe sua senha</h1>
         <p class="text-danger text-center"><span id="erro"></span></p>
         <div class="form-floating">
            <input type="text" class="form-control" id="login" placeholder="Login" value="user" disabled>
            <label for="login">Login </label>
         </div>
         <div class="form-floating">
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
            <label for="senha">Digite sua senha</label>
         </div>
         <button class="w-100 btn btn-lg btn-secondary" type="submit"
            onclick="logar(); return false">Desbloquear</button>
         <hr />
         <span class="badge bg-secondary-subtle text-secondary-emphasis badge-skill">Senha: user</span>
         <p class="mt-5 mb-3 text-muted">Rafael Horochovec &copy; 2026</p>
      </form>
   </main>

   <script src="assets/js/login.js"></script>
   <!-- Bootstrap 5.3 JS Bundle -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
</body>

</html>
